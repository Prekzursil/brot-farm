name: APRS intake

# GitHub-native APRS submission path (docs/adr/0001-aprs.md):
# an issue-form upload (.github/ISSUE_TEMPLATE/aprs.yml, label 'aprs') ->
# validate the attachment with scripts/validate_aprs.py -> dedupe by preview
# hash against collection/ -> comment pass/fail with reasons -> on pass open a
# curation PR adding collection/<hash>.aprs.json + the regenerated index.
# The bot merges NOTHING: human curation only.
#
# NB pull-requests: write is required in addition to contents/issues because
# opening the curation PR itself needs it; PRs opened by the default
# GITHUB_TOKEN do not re-trigger CI (GitHub anti-recursion rule) — the
# curator's review/reopen runs the checks.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: aprs-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'aprs') ||
      (github.event.action == 'opened' && contains(toJson(github.event.issue.labels), 'aprs'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the .aprs.json attachment
        id: find
        env:
          # env-passed, never interpolated into the shell (code-injection safety)
          REPO_SLUG: ${{ github.repository }}
        run: |
          body="$(gh api "repos/$REPO_SLUG/issues/$ISSUE" -q .body)"
          url="$(printf '%s' "$body" | grep -oE 'https://[^[:space:]())"<>]+[.]aprs[.]json' | head -1 || true)"
          if [ -z "$url" ]; then
            printf '%s\n' \
              "APRS intake :x: — no \`.aprs.json\` attachment link found in the issue body." \
              "Please attach the file (drag & drop it into the form field) so the body" \
              "carries an \`https://github.com/user-attachments/files/...aprs.json\` link," \
              "then re-add the \`aprs\` label." > /tmp/comment.md
            gh issue comment "$ISSUE" --body-file /tmp/comment.md
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download, validate, dedupe
        id: gate
        env:
          # externally-influenced value: pass via env, never interpolate into run:
          ATTACHMENT_URL: ${{ steps.find.outputs.url }}
        run: |
          curl -fsSL -o submit.aprs.json "$ATTACHMENT_URL"
          set +e
          python scripts/validate_aprs.py submit.aprs.json > reasons.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            { echo "APRS validation :x: — \`scripts/validate_aprs.py\` rejected the record:"; echo; \
              sed 's/^/> /' reasons.txt; echo; \
              echo "Fix the listed fields and submit again (the playground and \`brot_build aprs\` always emit valid records)."; \
            } > /tmp/comment.md
            gh issue comment "$ISSUE" --body-file /tmp/comment.md
            exit 1
          fi
          hash="$(python -c 'import json; print(json.load(open("submit.aprs.json"))["preview"])')"
          if [ "$hash" = "None" ]; then
            printf '%s\n' \
              "APRS intake :x: — the record has \`preview: null\`; collection entries need a" \
              "preview hash for dedupe and file naming. Re-export with a rendered preview." \
              > /tmp/comment.md
            gh issue comment "$ISSUE" --body-file /tmp/comment.md
            exit 1
          fi
          if [ -e "collection/$hash.aprs.json" ]; then
            printf '%s\n' \
              "APRS intake :x: — duplicate: a record with preview hash \`$hash\` is already" \
              "in the collection (collection/$hash.aprs.json)." > /tmp/comment.md
            gh issue comment "$ISSUE" --body-file /tmp/comment.md
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Open curation PR (nothing merges automatically)
        env:
          HASH: ${{ steps.gate.outputs.hash }}
        run: |
          name="$(python -c 'import json; print(json.load(open("submit.aprs.json"))["name"])')"
          branch="aprs-intake-$HASH"
          git config user.name "fractal-darkroom-intake[bot]"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          cp submit.aprs.json "collection/$HASH.aprs.json"
          python scripts/build_collection.py
          git add collection docs/assets/collection.js
          git commit -m "APRS intake: add $name ($HASH) from #$ISSUE"
          # opened+labeled fire twice for one form submission; the sibling run
          # may have pushed this deterministic branch first — that is success
          set +e
          git push origin "$branch" 2>/tmp/push_err.txt
          push_rc=$?
          set -e
          if [ "$push_rc" -ne 0 ]; then
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "branch $branch already on the remote (concurrent intake run) — continuing"
            else
              cat /tmp/push_err.txt
              exit 1
            fi
          fi
          printf '%s\n' \
            "Validated APRS submission from #$ISSUE (preview \`$HASH\`): **$name**" \
            "" \
            "- adds \`collection/$HASH.aprs.json\` exactly as submitted (validated by \`scripts/validate_aprs.py\`)" \
            "- regenerates \`collection/index.json\` + \`docs/assets/collection.js\` via \`scripts/build_collection.py\`" \
            "" \
            "Human curation only — nothing merges automatically. Checks do not auto-run" \
            "on bot-opened PRs; reviewers can close/reopen or push an empty commit to trigger lanes." \
            > /tmp/pr.md
          pr_url=""
          pr_note=""
          set +e
          pr_url="$(gh pr create --title "APRS intake: $name (#$ISSUE)" --body-file /tmp/pr.md --head "$branch" 2>/tmp/pr_err.txt)"
          pr_rc=$?
          set -e
          if [ "$pr_rc" -ne 0 ]; then
            if [ -n "$(gh pr list --head "$branch" --json number --jq '.[0].number' 2>/dev/null)" ]; then
              pr_url="$(gh pr list --head "$branch" --json url --jq '.[0].url')"
              echo "PR already open for $branch: $pr_url"
            elif grep -q "not permitted to create or approve pull requests" /tmp/pr_err.txt; then
              # repo setting "Allow GitHub Actions to create and approve pull
              # requests" is OFF — only the repo owner can enable it (Settings
              # -> Actions -> General). Post the one-click compare URL instead.
              pr_url="https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"
              pr_note=" (the repo currently blocks Actions-opened PRs — owner can enable it under Settings -> Actions -> General; meanwhile open the curation PR with one click)"
              echo "Actions PR creation blocked by repo setting — posting compare URL"
            else
              cat /tmp/pr_err.txt
              exit 1
            fi
          fi
          printf '%s\n' \
            "APRS validation :white_check_mark: — record accepted (preview \`$HASH\`), deduped" \
            "against the collection. Curation PR: $pr_url$pr_note — a human curates;" \
            "nothing merges automatically." > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md

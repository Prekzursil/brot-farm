name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # superseded PR runs are cancelled; runs on main always finish (with the
  # fail-closed ci-green below, a cancelled main run would otherwise leave a
  # red mark on a commit that was never actually tested)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Asset versioning drift tripwire
        run: python scripts/version_assets.py --check
      - name: Site suite (chromium, local server + file://)
        run: python scripts/verify_site.py --browsers chromium --origin http

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test with coverage gate (100% required)
        run: python -m pytest --cov -v
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          # .coverage is a dotfile, which upload-artifact@v4 skips by default
          include-hidden-files: true
          retention-days: 7
      - name: CLI smoke
        run: |
          python buddhabrot.py render --smoke
          python brot_farm.py --list
          test -f out/buddhabrot_smoke.png && echo "smoke render OK"

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research lab-notebook gate (JSON valid, sentinels present, sources compile)
        run: python scripts/check_research.py

  ci-green:
    # aggregate gate for branch protection: one stable context name that
    # requires every matrix cell above to have passed. Fail-closed: without
    # `if: always()` a failed or cancelled job above leaves ci-green *skipped*,
    # and a skipped required check counts as passing.
    needs: [site, test, research]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "no job results to aggregate"; exit 1; }
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required CI job did not succeed"; exit 1; }
          done
          echo "all CI jobs green"
